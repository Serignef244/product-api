---
- name: Deploy product-api on Ubuntu VM
  hosts: all
  become: true
  vars:
    docker_image: serignef244/product-api:v2
    container_name: product-api
    app_port: 8086
    mysql_db: productdb
    mysql_user: productapp
    mysql_password: productapp123

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and MySQL
      ansible.builtin.apt:
        name:
          - docker.io
          - mysql-server
          - python3-pymysql
        state: present

    - name: Ensure Docker is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure MySQL is started and enabled
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Create application database
      community.mysql.mysql_db:
        name: "{{ mysql_db }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create application MySQL user
      community.mysql.mysql_user:
        name: "{{ mysql_user }}"
        password: "{{ mysql_password }}"
        host: "%"
        priv: "{{ mysql_db }}.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Ensure products table exists
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_db: "{{ mysql_db }}"
        query: |
          CREATE TABLE IF NOT EXISTS products (
            id BIGINT NOT NULL AUTO_INCREMENT,
            name VARCHAR(255) NOT NULL,
            `description` VARCHAR(1024) NOT NULL,
            price DECIMAL(10,2) NOT NULL,
            quantity INT NOT NULL,
            PRIMARY KEY (id)
          );

    - name: Pull latest image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Stop existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: stopped
      ignore_errors: true

    - name: Remove existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Start new container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        network_mode: host
        env:
          SPRING_DATASOURCE_URL: "jdbc:mysql://localhost:3306/{{ mysql_db }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          SPRING_DATASOURCE_USERNAME: "{{ mysql_user }}"
          SPRING_DATASOURCE_PASSWORD: "{{ mysql_password }}"

    - name: Verify API endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/api/products"
        method: GET
        status_code: 200
      register: api_check
      retries: 10
      delay: 5
      until: api_check.status == 200
