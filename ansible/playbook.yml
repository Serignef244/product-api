---
- name: Deploy product-api on Ubuntu VM
  hosts: all
  become: true
  vars:
    docker_image: dockerhub_votre_username/product-api:latest
    container_name: product-api
    app_port: 8086

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and MySQL
      ansible.builtin.apt:
        name:
          - docker.io
          - mysql-server
        state: present

    - name: Ensure Docker is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure MySQL is started and enabled
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Pull latest image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Stop existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Remove existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Start new container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        published_ports:
          - "{{ app_port }}:{{ app_port }}"

    - name: Verify API endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/api/products"
        method: GET
        status_code: 200
      register: api_check
      retries: 10
      delay: 5
      until: api_check.status == 200
